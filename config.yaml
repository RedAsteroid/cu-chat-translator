# ============================================================
#  翻译服务配置（修改后重启服务生效）
#  「默认」指该行未填写时程序采用的行为
# ============================================================

# ---------------------- 必填项 ----------------------

# 模型名称。默认预设 deepseek-flash，换服务商时参考下方示例。
# 本项必填，无默认值
model_name: "deepseek-flash"

# OpenAI 兼容接口地址。DeepSeek 为 https://api.deepseek.com，多数服务商以 /v1 结尾。
# 本项必填，无默认值
base_url: "https://api.deepseek.com"

# API 密钥。留空将无法启动。
# 本项必填，无默认值
api_key: ""

# 服务端口。修改后需同步修改插件 CustomApiUrl（http://127.0.0.1:<端口>/）。
# 默认：8000（非整数或超出 1~65535 时同样回退）
port: 8000

# 切换服务商示例（model_name 与 base_url 需同时替换）：
#   DeepSeek（默认）：deepseek-flash / https://api.deepseek.com，send_temperature、send_max_tokens 保持 true
#   Kimi：kimi-k2.6（以服务商文档为准）/ https://api.moonshot.cn/v1，send_temperature、send_max_tokens 改为 false

# ---------------------- 可选设置 ----------------------

# 采样温度。建议 0.2~0.4，数值越大表达越多样。
# 默认：不发送
temperature: 0.3

# 是否将采样温度随请求发送。固定温度的服务商（如 Kimi）设为 false。
# 默认：true
send_temperature: true

# 单次输出长度上限。思考模式下过大可能截断回答。
# 默认：不发送
max_tokens: 512

# 是否将长度参数随请求发送。Kimi 设为 false（该参数已废弃，改用 max_completion_tokens）。
# 默认：true
send_max_tokens: true

# 长度参数名，可选 max_tokens 或 max_completion_tokens。
# 默认：max_tokens（填其他值同样回退）
max_tokens_param: "max_tokens"

# 是否要求服务端以 JSON 返回。服务商不支持时设为 false。
# 默认：true
json_mode: true

# 思考模式。开启后模型先推理再作答，质量可能更稳，但更慢、更贵；思考过程会占用输出预算，
# max_tokens 较小时可能导致译文为空或被截断。
# 发送形式为 {"thinking": {"type": "enabled" 或 "disabled"}}，仅对支持该字段的服务商有效；
# 服务商不支持时会返回 400，程序会自动去掉可选参数重试一次，但该设置也随之失效。
# 聊天翻译对延迟敏感，建议保持 false。
# 默认：false（请求中发送 disabled）
thinking: false

# 是否将 thinking 字段随请求发送。设为 false 时默认完全不发送，由服务商自行决定是否思考。
# 适用场景：服务商不认识 thinking 字段，或默认开启思考导致变慢、译文被截断。
# 注意：extra_body_json 中显式写了 thinking 时以它为准，本开关不再拦截；本项为 false 时，
# 上面的 thinking 取值也不再生效。
# 默认：true
send_thinking: true

# 服务商特有参数（JSON 字符串），与上述参数合并；冲突时以此处为准。
# 示例：{"enable_thinking": false}、{"reasoning_effort": "low"}
# 默认：留空，不发送
extra_body_json: ''

# 单次请求超时，单位：秒（每次尝试单独计时）。
# 默认：60 秒
timeout: 60

# 网络异常（限流、服务端错误、连接失败）时的自动重试次数。
# 默认：0（不重试）
max_retries: 0